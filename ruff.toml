target-version = 'py312'

[lint]
# Start with fatal parser/runtime-binding checks across all tracked Python,
# including .council. Broader style and modernization rules are legacy debt.
select = ['E9', 'F63', 'F7']

# ---------------------------------------------------------------------------
# A38-B, measured 2026-09-20. READ THIS BEFORE "fixing ruff findings" again.
#
# `ruff check <file>` from the repo root uses the select above and answers
# "All checks passed!" for code_tools.py. Anything a wider run reports is
# OUT OF GATE BY DESIGN -- not debt somebody forgot. Two gates exist and they
# disagree on purpose: [A]'s own write-time validator runs a wider set and
# reports its findings in write_fix.validation.lint_warning, which is advice,
# not a failing check.
#
# Baseline for code_tools.py after A38-B, per rule, `ruff check --isolated
# --select <rule> --statistics`:
#
#   E402  17  module-level import not at top of file -- STRUCTURAL, not a
#             defect: this module registers tools in stages and imports the
#             later stages where they are used. Moving them to the top is a
#             refactor of the registration order, never a lint fix.
#   F401   0  (was 1; A38-B deleted the dead orchestrator.graph.config import)
#   F811   0  (was 5; all five were the session-log wrappers redefining names
#             the deleted import had bound -- one deletion closed both rules)
#   F841   0  (was 1; the unused see_also_macros dict, deleted as a contract
#             defect: bootstrap_session promised it and never returned it)
#   I001   0  keep it there. A comment placed INSIDE an import block makes
#             isort report the block un-sorted -- measured on this very file.
#   F821, F822, E711, E712, E722, F632: 0. These are the error-class rules a
#             wider select would add, and there is nothing hiding behind them.
#
# E501 (~1423) and BLE001 (~282) are the two loud style families. They are
# legacy debt, deliberately unselected, and re-measuring them proves nothing.
# ---------------------------------------------------------------------------
#
# A38-B round 2, measured 2026-09-20. The E7 one-liner family, and why the fix
# is a scoped ignore instead of 59 edits:
#
#   E701  17  code_tools.py -- multiple statements on one line (colon)
#   E702   6  code_tools.py -- multiple statements on one line (semicolon)
#   E741   0  code_tools.py (was 1: the app-session-log reader bound the loop
#             variable to a single lowercase L, which reads as 1 or I; renamed.
#             That one WAS a real defect, and it is fixed, not ignored)
#
# tools_v15.py carries 31 more E701 and 4 more E702 of the same shape. Every one
# of the 59 survivors was READ before being kept: try/except one-liners in the
# T4 desktop shims, aligned assignment tables, and aligned dispatch returns
# where the column alignment IS the documentation. Splitting them changes no
# behaviour, doubles the line count, and destroys that alignment.
#
# Exactly two of the 61 sites were real defects and both are fixed: the rename
# above, and the single line that carried BOTH rules at once --
# `if status == "pending": a = ...; b.pop(...)` -- where the semicolon made the
# pop() read as unconditional. That one is now a properly indented block.
#
# THE ROOT FIX IS THE TABLE BELOW, not a per-line suppression. A comment cannot
# stop the next CA from running a wider --select and re-opening a measurement
# that is already closed; a per-file-ignores entry makes ruff itself answer
# zero. MEASURED 2026-09-20: per-file-ignores wins over a CLI --select (two
# byte-identical probe files, one listed in the table and one not -- the listed
# one reported 0, the other reported 3). The entry is scoped to these two files
# and to these two rules, so it cannot hide anything anywhere else, and the
# enforced gate above (E9/F63/F7) is untouched by it.
# The counts above stay honest because tests/test_a38b_lint_contract.py
# re-measures them with --isolated, which deliberately bypasses this table.
# ---------------------------------------------------------------------------

[lint.per-file-ignores]
'code_tools.py' = ['E701', 'E702']
'tools_v15.py' = ['E701', 'E702']
